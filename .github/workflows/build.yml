name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python and pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall

      - name: Install Qt for Android
        run: |
          aqt install-qt linux android 6.5.0 android_arm64_v8a
          echo "QT_ROOT=$PWD/6.5.0/android_arm64_v8a" >> $GITHUB_ENV

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          mkdir build && cd build
          $QT_ROOT/bin/qt-cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DQT_HOST_PATH=$QT_ROOT \
            -GNinja

      - name: Build APK
        run: |
          cd build
          cmake --build . --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokClone-APK
          path: build/android-build/build/outputs/apk/release/*.apk
